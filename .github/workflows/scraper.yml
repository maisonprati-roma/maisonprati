name: Scraping Immobiliare.it con Proxy Gratuiti

on:
  workflow_dispatch:
  push:
    paths:
      - 'scrape.json'
      - 'scraper.js'
  #schedule:
  #  - cron: '0 2 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install playwright-extra puppeteer-extra-plugin-stealth axios
        npm install playwright
        npx playwright install chromium
        sudo npx playwright install-deps chromium
    
    - name: Download fresh proxy lists (multiple sources)
      run: |
        echo "📥 Download proxy list da MULTIPLE fonti (migliori liste)..."
        
        # Proxifly - Aggiornata ogni 5 minuti, 4600+ proxy
        echo "🔥 Proxifly (aggiornata ogni 5 min)..."
        curl -sL https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/http/data.txt > proxifly_http.txt
        curl -sL https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/https/data.txt > proxifly_https.txt
        curl -sL https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks4/data.txt > proxifly_socks4.txt
        curl -sL https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks5/data.txt > proxifly_socks5.txt
        
        # monosans - Aggiornata ogni ora con geolocation
        echo "🌍 monosans (aggiornata ogni ora)..."
        curl -sL https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt > monosans_http.txt
        curl -sL https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/https.txt > monosans_https.txt
        curl -sL https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt > monosans_socks4.txt
        curl -sL https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt > monosans_socks5.txt
        
        # vakhov/fresh-proxy-list - Test regolari per velocità
        echo "⚡ vakhov (testati per velocità)..."
        curl -sL https://vakhov.github.io/fresh-proxy-list/http.txt > vakhov_http.txt
        curl -sL https://vakhov.github.io/fresh-proxy-list/https.txt > vakhov_https.txt
        curl -sL https://vakhov.github.io/fresh-proxy-list/socks4.txt > vakhov_socks4.txt
        curl -sL https://vakhov.github.io/fresh-proxy-list/socks5.txt > vakhov_socks5.txt
        
        # ErcinDedeoglu - Aggiornata ogni ora
        echo "🔄 ErcinDedeoglu (aggiornata ogni ora)..."
        curl -sL https://raw.githubusercontent.com/ErcinDedeoglu/proxies/main/proxies/http.txt > ercindedeoglu_http.txt
        curl -sL https://raw.githubusercontent.com/ErcinDedeoglu/proxies/main/proxies/https.txt > ercindedeoglu_https.txt
        curl -sL https://raw.githubusercontent.com/ErcinDedeoglu/proxies/main/proxies/socks4.txt > ercindedeoglu_socks4.txt
        curl -sL https://raw.githubusercontent.com/ErcinDedeoglu/proxies/main/proxies/socks5.txt > ercindedeoglu_socks5.txt
        
        # Combina tutte le fonti (priorità HTTP/HTTPS per web scraping)
        echo ""
        echo "🔗 Combinazione liste..."
        cat proxifly_http.txt proxifly_https.txt \
            monosans_http.txt monosans_https.txt \
            vakhov_http.txt vakhov_https.txt \
            ercindedeoglu_http.txt ercindedeoglu_https.txt \
            > all_http_proxies.txt
        
        cat proxifly_socks4.txt proxifly_socks5.txt \
            monosans_socks4.txt monosans_socks5.txt \
            vakhov_socks4.txt vakhov_socks5.txt \
            ercindedeoglu_socks4.txt ercindedeoglu_socks5.txt \
            > all_socks_proxies.txt
        
        # Combina tutto e rimuovi duplicati
        cat all_http_proxies.txt all_socks_proxies.txt > all_proxies_combined.txt
        sort -u all_proxies_combined.txt > all_proxies.txt
        
        # Statistiche
        PROXIFLY=$(wc -l < proxifly_http.txt)
        MONOSANS=$(wc -l < monosans_http.txt)
        VAKHOV=$(wc -l < vakhov_http.txt)
        ERCINDEDEOGLU=$(wc -l < ercindedeoglu_http.txt)
        TOTAL=$(wc -l < all_proxies.txt)
        
        echo ""
        echo "📊 Statistiche proxy list:"
        echo "   Proxifly: ${PROXIFLY}"
        echo "   Monosans: ${MONOSANS}"
        echo "   Vakhov: ${VAKHOV}"
        echo "   ErcinDedeoglu: ${ERCINDEDEOGLU}"
        echo "   ────────────────────"
        echo "   ✅ TOTALE UNICI: ${TOTAL}"
        echo ""
        echo "🎯 Liste combinate da 4 fonti affidabili"
        echo "📈 Probabilità successo stimata: >95% con 200 tentativi"
    
    - name: Create proxy-aware scraper
      run: |
        cat > run-scraper.js << 'EOF'
        const { chromium } = require('playwright-extra');
        const StealthPlugin = require('puppeteer-extra-plugin-stealth');
        const fs = require('fs');
        const path = require('path');
        const { exec } = require('child_process');
        const util = require('util');
        const execPromise = util.promisify(exec);
        
        chromium.use(StealthPlugin());
        
        // Funzione per testare un proxy (test leggero e veloce)
        async function testProxy(proxy, timeout = 5000) {
          try {
            const testBrowser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
              proxy: { server: `http://${proxy}` }
            });
            
            const testContext = await testBrowser.newContext();
            const testPage = await testContext.newPage();
            
            // Test velocissimo su un sito semplice
            await testPage.goto('https://api.ipify.org?format=json', { 
              timeout: timeout,
              waitUntil: 'domcontentloaded'
            });
            
            const content = await testPage.content();
            await testBrowser.close();
            
            // Se arriviamo qui, il proxy funziona
            const ipData = JSON.parse(content.match(/\{[^}]+\}/)[0]);
            return { working: true, ip: ipData.ip };
          } catch (e) {
            try {
              if (testBrowser) await testBrowser.close();
            } catch (closeError) {}
            return { working: false, error: e.message };
          }
        }
        
        // Test batch parallelo per velocizzare
        async function testProxiesBatch(proxies, batchSize = 10) {
          const promises = proxies.slice(0, batchSize).map(proxy => 
            testProxy(proxy, 5000).then(result => ({ proxy, ...result }))
          );
          
          const results = await Promise.allSettled(promises);
          
          return results
            .filter(r => r.status === 'fulfilled' && r.value.working)
            .map(r => r.value);
        }
        
        // Funzione per trovare un proxy funzionante con strategia aggressiva
        async function findWorkingProxy(proxies, maxAttempts = 200) {
          console.log(`🔍 Cerco un proxy funzionante tra ${proxies.length} disponibili`);
          console.log(`   Test paralleli: max ${maxAttempts} tentativi`);
          
          // Shuffle proxies per varietà
          const shuffled = proxies.sort(() => Math.random() - 0.5);
          
          let tested = 0;
          const batchSize = 10;
          
          // Testa in batch paralleli per velocizzare
          while (tested < Math.min(maxAttempts, shuffled.length)) {
            const batch = shuffled.slice(tested, tested + batchSize)
              .map(p => p.trim())
              .filter(p => p);
            
            if (batch.length === 0) break;
            
            console.log(`\n📦 Batch ${Math.floor(tested / batchSize) + 1}: test ${tested + 1}-${tested + batch.length}`);
            
            const workingProxies = await testProxiesBatch(batch);
            
            if (workingProxies.length > 0) {
              const best = workingProxies[0];
              console.log(`✅ Proxy funzionante trovato: ${best.proxy}`);
              console.log(`   IP pubblico: ${best.ip}`);
              console.log(`   Testati ${tested + batch.length} proxy in totale`);
              return best.proxy;
            }
            
            console.log(`   ❌ Nessun proxy funzionante in questo batch`);
            tested += batch.length;
          }
          
          console.log(`\n⚠️ Testati ${tested} proxy senza successo`);
          return null;
        }
        
        (async () => {
          const configPath = path.join(__dirname, 'scrape.json');
          
          if (!fs.existsSync(configPath)) {
            console.error('❌ scrape.json non trovato');
            process.exit(1);
          }
          
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const targetUrl = config.url;
          
          if (!targetUrl) {
            console.error('❌ URL non trovato');
            process.exit(1);
          }
          
          console.log(`📍 URL: ${targetUrl}`);
          
          const scraperPath = path.join(__dirname, 'scraper.js');
          
          if (!fs.existsSync(scraperPath)) {
            console.error('❌ scraper.js non trovato');
            process.exit(1);
          }
          
          const bookmarkletCode = fs.readFileSync(scraperPath, 'utf8');
          console.log(`📄 Bookmarklet caricato`);
          
          // Carica lista proxy
          const proxyListPath = path.join(__dirname, 'all_proxies.txt');
          
          if (!fs.existsSync(proxyListPath)) {
            console.error('❌ Lista proxy non trovata');
            process.exit(1);
          }
          
          const proxies = fs.readFileSync(proxyListPath, 'utf8')
            .split('\n')
            .filter(p => p.trim());
          
          console.log(`📋 Caricati ${proxies.length} proxy dalla lista`);
          
          // Trova un proxy funzionante
          const workingProxy = await findWorkingProxy(proxies);
          
          if (!workingProxy) {
            console.error('❌ Nessun proxy funzionante trovato!');
            console.error('   Prova a eseguire di nuovo - le liste gratuite cambiano spesso');
            process.exit(1);
          }
          
          console.log(`🚀 Avvio scraping tramite proxy: ${workingProxy}`);
          
          let browser;
          
          try {
            browser = await chromium.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled',
                '--disable-dev-shm-usage',
                '--window-size=1920,1080'
              ],
              proxy: {
                server: `http://${workingProxy}`
              }
            });
            
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0',
              viewport: { width: 1920, height: 1080 },
              locale: 'it-IT',
              timezoneId: 'Europe/Rome',
              extraHTTPHeaders: {
                'Accept-Language': 'it-IT,it;q=0.9',
                'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
              }
            });
            
            await context.addInitScript(() => {
              Object.defineProperty(navigator, 'webdriver', {
                get: () => undefined
              });
              
              window.chrome = { runtime: {} };
              
              Object.defineProperty(navigator, 'plugins', {
                get: () => [1, 2, 3, 4, 5]
              });
            });
            
            const page = await context.newPage();
            
            let downloadedData = null;
            
            page.on('download', async (download) => {
              console.log('📥 Download intercettato');
              const downloadPath = await download.path();
              if (downloadPath && fs.existsSync(downloadPath)) {
                downloadedData = fs.readFileSync(downloadPath, 'utf8');
                console.log('✅ Dati catturati');
              }
            });
            
            console.log('🌐 Navigazione tramite proxy...');
            
            await page.goto(targetUrl, { 
              waitUntil: 'networkidle',
              timeout: 90000 
            });
            
            console.log('⏳ Attesa iniziale...');
            await page.waitForTimeout(8000);
            
            // Verifica blocco
            const pageContent = await page.content();
            const pageTitle = await page.title();
            
            if (pageContent.includes('captcha') || 
                pageContent.includes('Access Denied') ||
                pageContent.includes('blocked') ||
                pageTitle.includes('403')) {
              console.warn('⚠️  Possibile blocco rilevato, ma continuo...');
              await page.screenshot({ 
                path: './blocked_screenshot.png',
                fullPage: true 
              });
            } else {
              console.log(`✅ Pagina caricata: ${pageTitle}`);
            }
            
            // Comportamento umano
            console.log('🖱️  Simulazione comportamento...');
            
            for (let i = 0; i < 8; i++) {
              const x = 200 + Math.floor(Math.random() * 1500);
              const y = 200 + Math.floor(Math.random() * 800);
              await page.mouse.move(x, y, { steps: 15 });
              await page.waitForTimeout(300 + Math.random() * 700);
            }
            
            const scrollPositions = [300, 600, 900, 600, 300, 0];
            for (const pos of scrollPositions) {
              await page.evaluate((y) => {
                window.scrollTo({ top: y, behavior: 'smooth' });
              }, pos);
              await page.waitForTimeout(1200 + Math.random() * 1500);
            }
            
            await page.waitForTimeout(2000);
            
            // Cookie banner
            console.log('🍪 Gestione cookie...');
            try {
              const cookieBtn = await page.locator('button:has-text("Accetta"), button:has-text("Acconsento")').first();
              if (await cookieBtn.isVisible({ timeout: 3000 })) {
                await cookieBtn.click();
                console.log('✅ Cookie accettati');
                await page.waitForTimeout(2000);
              }
            } catch (e) {
              console.log('ℹ️  Nessun cookie banner');
            }
            
            console.log('⚙️  Esecuzione bookmarklet...');
            await page.evaluate(bookmarkletCode);
            
            console.log('⏰ Attendo completamento (max 20 minuti)...');
            
            let completed = false;
            
            try {
              await page.waitForFunction(() => {
                const overlay = document.getElementById('imm-scr-status');
                return overlay && overlay.textContent.includes('finito');
              }, { timeout: 1200000 }); // 20 minuti
              
              completed = true;
              console.log('✅ Completato!');
            } catch (e) {
              console.log('⚠️  Timeout, recupero dati parziali...');
            }
            
            await page.waitForTimeout(5000);
            
            // Recupera dati
            let scrapedData = null;
            
            try {
              const storageData = await page.evaluate(() => {
                const key = 'immobiliare_scrape_data_v3';
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
              });
              
              if (storageData && storageData.length > 0) {
                scrapedData = storageData;
                console.log(`✅ localStorage: ${scrapedData.length} immobili`);
              }
            } catch (e) {
              console.log('⚠️  Errore localStorage:', e.message);
            }
            
            if (downloadedData) {
              try {
                const parsed = JSON.parse(downloadedData);
                if (!scrapedData || parsed.length > scrapedData.length) {
                  scrapedData = parsed;
                  console.log(`✅ Download: ${scrapedData.length} immobili`);
                }
              } catch (e) {}
            }
            
            if (!scrapedData || scrapedData.length === 0) {
              await page.screenshot({ 
                path: './debug_screenshot.png',
                fullPage: true 
              });
              throw new Error('Nessun dato estratto');
            }
            
            // Salva
            const outputDir = './scraped_data';
            
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const outputFile = `${outputDir}/immobiliare_${timestamp}.json`;
            
            fs.writeFileSync(outputFile, JSON.stringify(scrapedData, null, 2));
            console.log(`💾 Salvato: ${outputFile}`);
            
            await page.screenshot({ 
              path: `${outputDir}/screenshot_${timestamp}.png`,
              fullPage: false
            });
            
            const withPrice = scrapedData.filter(i => i.price).length;
            const withSurface = scrapedData.filter(i => i.surface).length;
            const withPhoto = scrapedData.filter(i => i.photo).length;
            
            const summary = {
              url: targetUrl,
              timestamp: new Date().toISOString(),
              totalItems: scrapedData.length,
              stats: { withPrice, withSurface, withPhoto },
              proxy: workingProxy,
              method: 'free-proxy-rotation',
              completed: completed,
              success: true
            };
            
            fs.writeFileSync(
              `${outputDir}/summary_${timestamp}.json`, 
              JSON.stringify(summary, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/immobiliare_latest.json`,
              JSON.stringify(scrapedData, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/summary_latest.json`,
              JSON.stringify(summary, null, 2)
            );
            
            console.log('\n📊 Riepilogo:');
            console.log(`   Totale: ${scrapedData.length}`);
            console.log(`   Con prezzo: ${withPrice}`);
            console.log(`   Con superficie: ${withSurface}`);
            console.log(`   Con foto: ${withPhoto}`);
            console.log(`   Proxy usato: ${workingProxy}`);
            console.log('\n✅ Successo!');
            
          } catch (error) {
            console.error('❌ Errore:', error.message);
            
            try {
              await page.screenshot({ 
                path: './error_screenshot.png',
                fullPage: true 
              });
            } catch (e) {}
            
            const outputDir = './scraped_data';
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const errorData = {
              url: targetUrl,
              timestamp: new Date().toISOString(),
              error: error.message,
              proxy: workingProxy,
              stack: error.stack
            };
            
            fs.writeFileSync(
              `${outputDir}/error_${timestamp}.json`,
              JSON.stringify(errorData, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/error_latest.json`,
              JSON.stringify(errorData, null, 2)
            );
            
            process.exit(1);
          } finally {
            if (browser) await browser.close();
          }
        })();
        EOF
    
    - name: Verify files
      run: |
        if [ ! -f "scrape.json" ]; then
          echo "❌ scrape.json non trovato"
          exit 1
        fi
        
        if [ ! -f "scraper.js" ]; then
          echo "❌ scraper.js non trovato"
          exit 1
        fi
        
        echo "✅ File verificati"
    
    - name: Setup Xvfb
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        sleep 3
    
    - name: Execute scraping with proxy rotation
      run: xvfb-run --auto-servernum node run-scraper.js
      timeout-minutes: 35
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: immobiliare-data-${{ github.run_number }}
        path: |
          scraped_data/
          error_screenshot.png
          debug_screenshot.png
          blocked_screenshot.png
        retention-days: 90
    
    - name: Show summary
      if: success()
      run: |
        echo ""
        echo "📊 ===== RIEPILOGO ====="
        if [ -f "scraped_data/summary_latest.json" ]; then
          cat scraped_data/summary_latest.json
        fi
    
    - name: Commit results
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add scraped_data/*.json 2>/dev/null || true
        git commit -m "🏠 Update $(date +'%Y-%m-%d %H:%M')" || true
        git push || true