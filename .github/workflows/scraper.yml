name: Scraping Immobiliare.it (Stealth Mode)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scrape.json'
      - 'scraper.js'
  schedule:
    - cron: '0 2 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install undetected-playwright (GRATUITO)
      run: |
        npm init -y
        npm install playwright-extra puppeteer-extra-plugin-stealth
        npm install playwright
        npx playwright install chromium
        sudo npx playwright install-deps chromium
    
    - name: Create stealth wrapper
      run: |
        cat > run-scraper.js << 'EOF'
        const { chromium } = require('playwright-extra');
        const StealthPlugin = require('puppeteer-extra-plugin-stealth');
        const fs = require('fs');
        const path = require('path');
        
        // Applica plugin stealth (GRATUITO - rimuove CDP leaks)
        chromium.use(StealthPlugin());
        
        (async () => {
          const configPath = path.join(__dirname, 'scrape.json');
          
          if (!fs.existsSync(configPath)) {
            console.error('❌ scrape.json non trovato');
            process.exit(1);
          }
          
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const targetUrl = config.url;
          
          if (!targetUrl) {
            console.error('❌ URL non trovato');
            process.exit(1);
          }
          
          console.log(`📍 URL: ${targetUrl}`);
          
          const scraperPath = path.join(__dirname, 'scraper.js');
          
          if (!fs.existsSync(scraperPath)) {
            console.error('❌ scraper.js non trovato');
            process.exit(1);
          }
          
          const bookmarkletCode = fs.readFileSync(scraperPath, 'utf8');
          console.log(`📄 Bookmarklet caricato`);
          console.log(`🥷 Modalità STEALTH attiva (anti-CDP)`);
          
          // Lancia browser con massima stealth
          const browser = await chromium.launch({
            headless: true,  // headless=true con stealth è OK
            args: [
              '--no-sandbox',
              '--disable-setuid-sandbox',
              '--disable-blink-features=AutomationControlled',
              '--disable-dev-shm-usage',
              '--disable-web-security',
              '--disable-features=IsolateOrigins,site-per-process',
              '--disable-site-isolation-trials',
              '--disable-features=BlockInsecurePrivateNetworkRequests',
              // Argomenti extra per sembrare umano
              '--window-size=1920,1080',
              '--disable-infobars',
              '--disable-breakpad',
              '--disable-component-extensions-with-background-pages',
              '--disable-extensions',
              '--disable-features=TranslateUI',
              '--disable-ipc-flooding-protection',
              '--disable-renderer-backgrounding',
              '--enable-features=NetworkService,NetworkServiceInProcess',
              '--force-color-profile=srgb',
              '--hide-scrollbars',
              '--metrics-recording-only',
              '--mute-audio',
              '--no-first-run',
              '--disable-background-timer-throttling',
              '--disable-backgrounding-occluded-windows',
              '--disable-hang-monitor',
              '--disable-prompt-on-repost'
            ]
          });
          
          // Context con fingerprint realistico
          const context = await browser.newContext({
            userAgent: 'Mozilla/5.0',  // USER AGENT SEMPLICE come richiesto
            viewport: { width: 1920, height: 1080 },
            screen: { width: 1920, height: 1080 },
            deviceScaleFactor: 1,
            isMobile: false,
            hasTouch: false,
            locale: 'it-IT',
            timezoneId: 'Europe/Rome',
            geolocation: { latitude: 41.9028, longitude: 12.4964 },
            permissions: ['geolocation'],
            colorScheme: 'light',
            extraHTTPHeaders: {
              'Accept-Language': 'it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7',
              'Accept-Encoding': 'gzip, deflate, br, zstd',
              'Cache-Control': 'max-age=0',
              'Sec-Ch-Ua': '"Not A(Brand";v="8", "Chromium";v="132"',
              'Sec-Ch-Ua-Mobile': '?0',
              'Sec-Ch-Ua-Platform': '"Linux"',
              'Sec-Ch-Ua-Platform-Version': '"6.5.0"',
              'Sec-Fetch-Dest': 'document',
              'Sec-Fetch-Mode': 'navigate',
              'Sec-Fetch-Site': 'none',
              'Sec-Fetch-User': '?1',
              'Upgrade-Insecure-Requests': '1',
              'DNT': '1'
            }
          });
          
          // Script anti-detection avanzato
          await context.addInitScript(() => {
            // Rimuovi completamente webdriver
            Object.defineProperty(navigator, 'webdriver', {
              get: () => undefined
            });
            
            // Chrome runtime completo
            window.chrome = {
              app: {
                isInstalled: false,
                InstallState: { DISABLED: 'disabled', INSTALLED: 'installed', NOT_INSTALLED: 'not_installed' },
                RunningState: { CANNOT_RUN: 'cannot_run', READY_TO_RUN: 'ready_to_run', RUNNING: 'running' }
              },
              runtime: {
                OnInstalledReason: { CHROME_UPDATE: 'chrome_update', INSTALL: 'install', SHARED_MODULE_UPDATE: 'shared_module_update', UPDATE: 'update' },
                OnRestartRequiredReason: { APP_UPDATE: 'app_update', OS_UPDATE: 'os_update', PERIODIC: 'periodic' },
                PlatformArch: { ARM: 'arm', ARM64: 'arm64', MIPS: 'mips', MIPS64: 'mips64', X86_32: 'x86-32', X86_64: 'x86-64' },
                PlatformNaclArch: { ARM: 'arm', MIPS: 'mips', MIPS64: 'mips64', X86_32: 'x86-32', X86_64: 'x86-64' },
                PlatformOs: { ANDROID: 'android', CROS: 'cros', LINUX: 'linux', MAC: 'mac', OPENBSD: 'openbsd', WIN: 'win' },
                RequestUpdateCheckStatus: { NO_UPDATE: 'no_update', THROTTLED: 'throttled', UPDATE_AVAILABLE: 'update_available' }
              },
              loadTimes: function() {},
              csi: function() {}
            };
            
            // Plugins realistici
            Object.defineProperty(navigator, 'plugins', {
              get: () => [
                { 0: { type: 'application/x-google-chrome-pdf', suffixes: 'pdf', description: 'Portable Document Format' }, description: 'Portable Document Format', filename: 'internal-pdf-viewer', length: 1, name: 'Chrome PDF Plugin' },
                { 0: { type: 'application/pdf', suffixes: 'pdf', description: '' }, description: 'Portable Document Format', filename: 'mhjfbmdgcfjbbpaeojofohoefgiehjai', length: 1, name: 'Chrome PDF Viewer' },
                { 0: { type: 'application/x-nacl', suffixes: '', description: 'Native Client Executable' }, 1: { type: 'application/x-pnacl', suffixes: '', description: 'Portable Native Client Executable' }, description: '', filename: 'internal-nacl-plugin', length: 2, name: 'Native Client' }
              ]
            });
            
            // Languages
            Object.defineProperty(navigator, 'languages', {
              get: () => ['it-IT', 'it', 'en-US', 'en']
            });
            
            // Hardware concurrency
            Object.defineProperty(navigator, 'hardwareConcurrency', {
              get: () => 8
            });
            
            // Device memory
            Object.defineProperty(navigator, 'deviceMemory', {
              get: () => 8
            });
            
            // Platform
            Object.defineProperty(navigator, 'platform', {
              get: () => 'Linux x86_64'
            });
            
            // MaxTouchPoints
            Object.defineProperty(navigator, 'maxTouchPoints', {
              get: () => 0
            });
            
            // Vendor
            Object.defineProperty(navigator, 'vendor', {
              get: () => 'Google Inc.'
            });
            
            // WebGL vendor/renderer
            const getParameter = WebGLRenderingContext.prototype.getParameter;
            WebGLRenderingContext.prototype.getParameter = function(parameter) {
              if (parameter === 37445) return 'Intel Inc.';
              if (parameter === 37446) return 'Intel Iris OpenGL Engine';
              return getParameter.call(this, parameter);
            };
            
            // Permissions API override
            const originalQuery = window.navigator.permissions.query;
            window.navigator.permissions.query = (parameters) => (
              parameters.name === 'notifications' 
                ? Promise.resolve({ state: Notification.permission, onchange: null })
                : originalQuery(parameters)
            );
            
            // Battery API (non presente in headless normalmente)
            Object.defineProperty(navigator, 'getBattery', {
              value: () => Promise.resolve({
                charging: true,
                chargingTime: 0,
                dischargingTime: Infinity,
                level: 1,
                addEventListener: () => {},
                removeEventListener: () => {},
                dispatchEvent: () => true
              })
            });
            
            // Connection API
            Object.defineProperty(navigator, 'connection', {
              get: () => ({
                effectiveType: '4g',
                rtt: 50,
                downlink: 10,
                saveData: false,
                addEventListener: () => {},
                removeEventListener: () => {},
                dispatchEvent: () => true
              })
            });
          });
          
          const page = await context.newPage();
          
          let downloadedData = null;
          
          page.on('download', async (download) => {
            console.log('📥 Download intercettato');
            const downloadPath = await download.path();
            if (downloadPath && fs.existsSync(downloadPath)) {
              downloadedData = fs.readFileSync(downloadPath, 'utf8');
              console.log('✅ Dati catturati');
            }
          });
          
          try {
            console.log('🌐 Navigazione in corso...');
            
            // Prima navigazione con delay lungo
            await page.goto(targetUrl, { 
              waitUntil: 'domcontentloaded',
              timeout: 90000 
            });
            
            console.log('⏳ Attesa iniziale (15 secondi)...');
            await page.waitForTimeout(15000);
            
            // Verifica blocco
            const pageContent = await page.content();
            const pageTitle = await page.title();
            
            if (pageContent.includes('captcha') || 
                pageContent.includes('Access Denied') ||
                pageContent.includes('cf-challenge') ||
                pageContent.includes('checking your browser') ||
                pageTitle.includes('Just a moment') ||
                pageTitle.includes('403')) {
              console.error('⚠️  Possibile blocco rilevato');
              await page.screenshot({ 
                path: './blocked_screenshot.png',
                fullPage: true 
              });
              console.log('📸 Screenshot salvato per analisi');
            } else {
              console.log(`✅ Pagina caricata: ${pageTitle}`);
            }
            
            // Comportamento umano intensivo
            console.log('🖱️  Simulazione comportamento umano esteso...');
            
            // Movimenti mouse molto graduali
            for (let i = 0; i < 15; i++) {
              const x = 100 + Math.floor(Math.random() * 1700);
              const y = 100 + Math.floor(Math.random() * 900);
              await page.mouse.move(x, y, { steps: 20 });
              await page.waitForTimeout(400 + Math.random() * 800);
            }
            
            // Scroll naturale multi-step
            const scrollPositions = [0, 200, 500, 800, 1200, 1600, 1200, 800, 400, 0];
            for (const pos of scrollPositions) {
              await page.evaluate((y) => {
                window.scrollTo({ top: y, behavior: 'smooth' });
              }, pos);
              await page.waitForTimeout(1500 + Math.random() * 2000);
            }
            
            // Click casuali su elementi non interattivi
            try {
              const safeElements = await page.$$('div, span, p');
              if (safeElements.length > 0) {
                const randomEl = safeElements[Math.floor(Math.random() * Math.min(5, safeElements.length))];
                await randomEl.click({ force: true }).catch(() => {});
                await page.waitForTimeout(1000);
              }
            } catch (e) {}
            
            // Cookie banner - prova multipli selettori
            console.log('🍪 Gestione cookie...');
            const cookieSelectors = [
              'button:has-text("Accetta")',
              'button:has-text("Acconsento")',
              'button:has-text("Accetta tutti")',
              'button:has-text("Accetta cookie")',
              '[data-testid="cookie-accept"]',
              '[id*="accept"]',
              '[id*="consent"]',
              '.cookie-accept',
              '#didomi-notice-agree-button'
            ];
            
            for (const selector of cookieSelectors) {
              try {
                const btn = page.locator(selector).first();
                if (await btn.isVisible({ timeout: 1000 })) {
                  await btn.click();
                  console.log(`✅ Cookie accettati (${selector})`);
                  await page.waitForTimeout(3000);
                  break;
                }
              } catch (e) {}
            }
            
            console.log('⚙️  Esecuzione bookmarklet...');
            console.log('📊 Tempo stimato: 5-15 minuti (200 pagine)');
            
            await page.evaluate(bookmarkletCode);
            
            console.log('⏰ Attendo completamento (max 20 minuti)...');
            
            let completed = false;
            
            try {
              await page.waitForFunction(() => {
                const overlay = document.getElementById('imm-scr-status');
                return overlay && overlay.textContent.includes('finito');
              }, { timeout: 1200000 }); // 20 minuti
              
              completed = true;
              console.log('✅ Scraping completato!');
            } catch (e) {
              console.log('⚠️  Timeout, recupero dati parziali...');
            }
            
            await page.waitForTimeout(5000);
            
            // Recupera dati
            let scrapedData = null;
            
            try {
              const storageData = await page.evaluate(() => {
                const key = 'immobiliare_scrape_data_v3';
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
              });
              
              if (storageData && storageData.length > 0) {
                scrapedData = storageData;
                console.log(`✅ localStorage: ${scrapedData.length} immobili`);
              }
            } catch (e) {
              console.log('⚠️  Errore localStorage:', e.message);
            }
            
            if (downloadedData) {
              try {
                const parsed = JSON.parse(downloadedData);
                if (!scrapedData || parsed.length > scrapedData.length) {
                  scrapedData = parsed;
                  console.log(`✅ Download: ${scrapedData.length} immobili`);
                }
              } catch (e) {}
            }
            
            if (!scrapedData || scrapedData.length === 0) {
              await page.screenshot({ 
                path: './debug_screenshot.png',
                fullPage: true 
              });
              throw new Error('Nessun dato estratto');
            }
            
            // Salva
            const outputDir = './scraped_data';
            
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const outputFile = `${outputDir}/immobiliare_${timestamp}.json`;
            
            fs.writeFileSync(outputFile, JSON.stringify(scrapedData, null, 2));
            console.log(`💾 Salvato: ${outputFile}`);
            
            await page.screenshot({ 
              path: `${outputDir}/screenshot_${timestamp}.png`,
              fullPage: false
            });
            
            const withPrice = scrapedData.filter(i => i.price).length;
            const withSurface = scrapedData.filter(i => i.surface).length;
            const withPhoto = scrapedData.filter(i => i.photo).length;
            
            const summary = {
              url: targetUrl,
              timestamp: new Date().toISOString(),
              totalItems: scrapedData.length,
              stats: { withPrice, withSurface, withPhoto },
              method: 'playwright-extra-stealth',
              userAgent: 'Mozilla/5.0',
              completed: completed,
              success: true
            };
            
            fs.writeFileSync(
              `${outputDir}/summary_${timestamp}.json`, 
              JSON.stringify(summary, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/immobiliare_latest.json`,
              JSON.stringify(scrapedData, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/summary_latest.json`,
              JSON.stringify(summary, null, 2)
            );
            
            console.log('\n📊 Riepilogo:');
            console.log(`   Totale: ${scrapedData.length}`);
            console.log(`   Con prezzo: ${withPrice}`);
            console.log(`   Con superficie: ${withSurface}`);
            console.log(`   Con foto: ${withPhoto}`);
            console.log('\n✅ Successo!');
            
          } catch (error) {
            console.error('❌ Errore:', error.message);
            
            try {
              await page.screenshot({ 
                path: './error_screenshot.png',
                fullPage: true 
              });
              const html = await page.content();
              fs.writeFileSync('./error_page.html', html);
              console.log('📸 Debug salvato');
            } catch (e) {}
            
            const outputDir = './scraped_data';
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const errorData = {
              url: targetUrl,
              timestamp: new Date().toISOString(),
              error: error.message,
              stack: error.stack
            };
            
            fs.writeFileSync(
              `${outputDir}/error_${timestamp}.json`,
              JSON.stringify(errorData, null, 2)
            );
            
            fs.writeFileSync(
              `${outputDir}/error_latest.json`,
              JSON.stringify(errorData, null, 2)
            );
            
            process.exit(1);
          } finally {
            await browser.close();
          }
        })();
        EOF
    
    - name: Verify files
      run: |
        if [ ! -f "scrape.json" ]; then
          echo "❌ scrape.json non trovato"
          exit 1
        fi
        
        if [ ! -f "scraper.js" ]; then
          echo "❌ scraper.js non trovato"
          exit 1
        fi
        
        echo "✅ File verificati"
    
    - name: Setup Xvfb
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        sleep 3
        echo "✅ Display virtuale"
    
    - name: Execute scraping
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node run-scraper.js
      timeout-minutes: 25
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: immobiliare-data-${{ github.run_number }}
        path: |
          scraped_data/
          error_screenshot.png
          debug_screenshot.png
          blocked_screenshot.png
          error_page.html
        retention-days: 90
    
    - name: Show summary
      if: success()
      run: |
        echo ""
        echo "📊 ===== RIEPILOGO ====="
        if [ -f "scraped_data/summary_latest.json" ]; then
          cat scraped_data/summary_latest.json
        fi
    
    - name: Commit results
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add scraped_data/*.json 2>/dev/null || true
        git commit -m "🏠 Update $(date +'%Y-%m-%d %H:%M')" || true
        git push || true