name: Scraping Immobiliare.it (Cloudflare Bypass)

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 */12 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: >-
          --health-cmd "curl -f http://localhost:8191/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install axios
    
    - name: Create FlareSolverr scraper
      run: |
        cat > scraper-flare.js << 'EOF'
        const axios = require('axios');
        const fs = require('fs');
        
        (async () => {
          const config = JSON.parse(fs.readFileSync('scrape.json', 'utf8'));
          const targetUrl = config.url;
          const bookmarkletCode = fs.readFileSync('scraper.js', 'utf8');
          
          console.log('🔥 Usando FlareSolverr per bypass Cloudflare');
          console.log(`📍 Target: ${targetUrl}`);
          
          // Step 1: Crea sessione con FlareSolverr (usa browser reale)
          const sessionResponse = await axios.post('http://localhost:8191/v1', {
            cmd: 'sessions.create',
            session: 'immobiliare_session'
          });
          
          console.log('✅ Sessione FlareSolverr creata');
          
          // Step 2: Richiedi la pagina tramite FlareSolverr (bypass Cloudflare)
          console.log('🌐 Bypass Cloudflare in corso...');
          
          const solveResponse = await axios.post('http://localhost:8191/v1', {
            cmd: 'request.get',
            url: targetUrl,
            session: 'immobiliare_session',
            maxTimeout: 60000
          }, {
            timeout: 65000
          });
          
          if (solveResponse.data.status !== 'ok') {
            throw new Error(`FlareSolverr fallito: ${solveResponse.data.message}`);
          }
          
          console.log('✅ Cloudflare bypassato!');
          console.log(`   User-Agent: ${solveResponse.data.solution.userAgent}`);
          console.log(`   Cookies: ${solveResponse.data.solution.cookies.length}`);
          
          // Step 3: Usa i cookies ottenuti per fare scraping con Playwright
          const { chromium } = require('playwright');
          
          console.log('🚀 Avvio Playwright con cookies autenticati');
          
          const browser = await chromium.launch({
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          
          const context = await browser.newContext({
            userAgent: solveResponse.data.solution.userAgent,
            viewport: { width: 1920, height: 1080 },
            locale: 'it-IT',
            timezoneId: 'Europe/Rome'
          });
          
          // Importa i cookies da FlareSolverr
          await context.addCookies(
            solveResponse.data.solution.cookies.map(c => ({
              name: c.name,
              value: c.value,
              domain: c.domain || '.immobiliare.it',
              path: c.path || '/',
              expires: c.expires || -1,
              httpOnly: c.httpOnly || false,
              secure: c.secure || false,
              sameSite: c.sameSite || 'Lax'
            }))
          );
          
          console.log('✅ Cookies importati');
          
          const page = await context.newPage();
          
          // Ora naviga normalmente - Cloudflare già bypassato
          console.log('🌐 Navigazione autenticata...');
          await page.goto(targetUrl, { 
            waitUntil: 'networkidle',
            timeout: 60000 
          });
          
          console.log('⏳ Comportamento umano...');
          await page.waitForTimeout(5000);
          
          // Scroll
          for (const y of [200, 500, 800, 400]) {
            await page.evaluate((scrollY) => {
              window.scrollTo({ top: scrollY, behavior: 'smooth' });
            }, y);
            await page.waitForTimeout(1500);
          }
          
          // Cookie banner
          try {
            const btn = await page.locator('button:has-text("Accetta")').first();
            if (await btn.isVisible({ timeout: 2000 })) {
              await btn.click();
              console.log('🍪 Cookie banner gestito');
              await page.waitForTimeout(1000);
            }
          } catch (e) {}
          
          // ESEGUI IL TUO BOOKMARKLET
          console.log('⚙️  Esecuzione bookmarklet...');
          await page.evaluate(bookmarkletCode);
          
          console.log('⏰ Attendo completamento...');
          
          try {
            await page.waitForFunction(() => {
              const overlay = document.getElementById('imm-scr-status');
              return overlay && overlay.textContent.includes('finito');
            }, { timeout: 600000 });
            
            console.log('✅ Scraping completato!');
          } catch (e) {
            console.log('⚠️  Timeout scraping');
          }
          
          await page.waitForTimeout(5000);
          
          // Recupera dati
          const scrapedData = await page.evaluate(() => {
            const key = 'immobiliare_scrape_data_v3';
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : null;
          });
          
          await browser.close();
          
          // Distruggi sessione FlareSolverr
          await axios.post('http://localhost:8191/v1', {
            cmd: 'sessions.destroy',
            session: 'immobiliare_session'
          });
          
          if (!scrapedData || scrapedData.length === 0) {
            throw new Error('Nessun dato estratto');
          }
          
          // Salva
          fs.mkdirSync('./scraped_data', { recursive: true });
          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          fs.writeFileSync(
            `./scraped_data/immobiliare_${timestamp}.json`,
            JSON.stringify(scrapedData, null, 2)
          );
          fs.writeFileSync(
            './scraped_data/immobiliare_latest.json',
            JSON.stringify(scrapedData, null, 2)
          );
          
          const summary = {
            url: targetUrl,
            timestamp: new Date().toISOString(),
            totalItems: scrapedData.length,
            cloudflare_bypassed: true,
            success: true
          };
          
          fs.writeFileSync(
            './scraped_data/summary_latest.json',
            JSON.stringify(summary, null, 2)
          );
          
          console.log(`\n✅ ${scrapedData.length} immobili salvati`);
          console.log('🔥 Cloudflare completamente bypassato!');
        })();
        EOF
    
    - name: Install Playwright
      run: |
        npm install -D @playwright/test
        npx playwright install chromium
        npx playwright install-deps chromium
    
    - name: Wait for FlareSolverr
      run: |
        echo "⏳ Attendo FlareSolverr..."
        for i in {1..30}; do
          if curl -s http://localhost:8191/health > /dev/null; then
            echo "✅ FlareSolverr pronto"
            exit 0
          fi
          sleep 2
        done
        echo "❌ FlareSolverr timeout"
        exit 1
    
    - name: Execute scraping
      run: node scraper-flare.js
      timeout-minutes: 15
    
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: data-${{ github.run_number }}
        path: scraped_data/
    
    - name: Commit results
      if: success()
      run: |
        git config user.email "actions@github.com"
        git config user.name "Bot"
        git add scraped_data/*.json
        git commit -m "🏠 $(date +'%Y-%m-%d %H:%M')" || true
        git push || true
