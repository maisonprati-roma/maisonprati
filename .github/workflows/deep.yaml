# .github/workflows/simple-chrome.yml
name: Simple Chrome Scraper
on: workflow_dispatch

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install Chrome
      run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
    
    - name: Leggi URL
      run: |
        URL=$(jq -r '.url' scarpe.json)
        echo "URL=$URL" >> $GITHUB_ENV
        echo "🎯 Target: $URL"
    
    - name: Screenshot diretto (fallback)
      run: |
        google-chrome-stable \
          --headless=new \
          --no-sandbox \
          --disable-gpu \
          --window-size=1920,1080 \
          --screenshot="screenshot.png" \
          "${{ env.URL }}"
        
        echo "📸 Screenshot catturato"
    
    - name: Download HTML semplice
      run: |
        # Usa curl con user-agent Chrome
        curl -s -L \
          -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -o "page.html" \
          "${{ env.URL }}" || true
        
        if [ -s "page.html" ]; then
          echo "✅ HTML scaricato: $(wc -l < page.html) linee"
        else
          echo "⚠️  HTML non scaricato"
        fi
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: direct-scrape
        path: |
          screenshot.png
          page.html