name: Scraping Immobiliare.it con Chrome Reale

on:
  workflow_dispatch:
  push:
    paths:
      - 'scrape.json'
      - 'scraper.js'
  schedule:
    - cron: '0 2 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Verify required files
      run: |
        echo "📂 Verifica file necessari..."
        
        if [ ! -f "scrape.json" ]; then
          echo "❌ ERRORE: scrape.json non trovato"
          exit 1
        fi
        
        if [ ! -f "scraper.js" ]; then
          echo "❌ ERRORE: scraper.js non trovato"
          exit 1
        fi
        
        echo "✅ File trovati"
        echo ""
        echo "📄 scrape.json:"
        cat scrape.json
    
    - name: Read configuration
      id: config
      run: |
        echo "📖 Lettura configurazione da scrape.json..."
        
        TARGET_URL=$(jq -r '.url' scrape.json)
        if [ -z "$TARGET_URL" ] || [ "$TARGET_URL" = "null" ]; then
          echo "❌ ERRORE: URL non trovato in scrape.json"
          exit 1
        fi
        
        echo "🎯 Target URL: $TARGET_URL"
        echo "TARGET_URL=$TARGET_URL" >> $GITHUB_ENV
    
    - name: Install Chrome and dependencies
      run: |
        echo "🛠️ Installazione Chrome e dipendenze..."
        sudo apt-get update -qq
        sudo apt-get install -y \
          google-chrome-stable \
          wget \
          curl \
          xvfb \
          jq \
          python3-pip
        
        pip3 install selenium webdriver-manager
        
        echo "✅ Chrome versione:"
        google-chrome --version
    
    - name: Create Python scraper with Chrome
      run: |
        cat > chrome_scraper.py << 'PYSCRIPT'
        import os
        import json
        import time
        import base64
        from pathlib import Path
        from selenium import webdriver
        from selenium.webdriver.chrome.service import Service
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.common.by import By
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        from webdriver_manager.chrome import ChromeDriverManager
        
        def read_config():
            """Leggi URL da scrape.json"""
            with open('scrape.json', 'r') as f:
                config = json.load(f)
            return config.get('url')
        
        def read_bookmarklet():
            """Leggi bookmarklet da scraper.js"""
            with open('scraper.js', 'r', encoding='utf-8') as f:
                return f.read()
        
        def setup_chrome_driver():
            """Configura Chrome con opzioni stealth"""
            chrome_options = Options()
            
            # Argomenti Chrome
            chrome_options.add_argument('--no-sandbox')
            chrome_options.add_argument('--disable-dev-shm-usage')
            chrome_options.add_argument('--disable-blink-features=AutomationControlled')
            chrome_options.add_argument('--disable-infobars')
            chrome_options.add_argument('--window-size=1920,1080')
            chrome_options.add_argument('--start-maximized')
            chrome_options.add_argument('--disable-extensions')
            chrome_options.add_argument('--disable-gpu')
            
            # User agent
            chrome_options.add_argument('--user-agent=Mozilla/5.0')
            
            # Preferenze
            prefs = {
                'download.default_directory': os.getcwd(),
                'download.prompt_for_download': False,
                'download.directory_upgrade': True,
                'safebrowsing.enabled': False
            }
            chrome_options.add_experimental_option('prefs', prefs)
            chrome_options.add_experimental_option('excludeSwitches', ['enable-automation'])
            chrome_options.add_experimental_option('useAutomationExtension', False)
            
            # Installa ChromeDriver
            service = Service(ChromeDriverManager().install())
            driver = webdriver.Chrome(service=service, options=chrome_options)
            
            # Rimuovi webdriver flag
            driver.execute_cdp_cmd('Page.addScriptToEvaluateOnNewDocument', {
                'source': '''
                    Object.defineProperty(navigator, 'webdriver', {
                        get: () => undefined
                    });
                    window.chrome = { runtime: {} };
                '''
            })
            
            return driver
        
        def wait_for_page_load(driver, timeout=30):
            """Attendi caricamento completo pagina"""
            try:
                WebDriverWait(driver, timeout).until(
                    lambda d: d.execute_script('return document.readyState') == 'complete'
                )
                return True
            except:
                return False
        
        def simulate_human_behavior(driver):
            """Simula comportamento umano"""
            print("🖱️  Simulazione comportamento umano...")
            
            time.sleep(3)
            
            # Scroll naturale
            for i in range(3):
                scroll_y = 300 * (i + 1)
                driver.execute_script(f'window.scrollTo({{top: {scroll_y}, behavior: "smooth"}});')
                time.sleep(1.5)
            
            driver.execute_script('window.scrollTo({top: 0, behavior: "smooth"});')
            time.sleep(2)
        
        def handle_cookie_banner(driver):
            """Gestisci cookie banner se presente"""
            print("🍪 Gestione cookie banner...")
            
            selectors = [
                'button:has-text("Accetta")',
                'button:has-text("Acconsento")',
                'button[id*="accept"]',
                'button[class*="cookie"]',
                '#didomi-notice-agree-button'
            ]
            
            for selector in selectors:
                try:
                    # Prova con JavaScript
                    script = f"""
                        const buttons = document.querySelectorAll('button');
                        for (let btn of buttons) {{
                            if (btn.textContent.includes('Accetta') || 
                                btn.textContent.includes('Acconsento')) {{
                                btn.click();
                                return true;
                            }}
                        }}
                        return false;
                    """
                    if driver.execute_script(script):
                        print("✅ Cookie banner gestito")
                        time.sleep(2)
                        return
                except:
                    continue
            
            print("ℹ️  Nessun cookie banner rilevato")
        
        def execute_bookmarklet(driver, bookmarklet_code):
            """Esegui il bookmarklet JavaScript"""
            print("⚙️  Esecuzione bookmarklet...")
            
            try:
                # Wrap del codice se necessario
                if not bookmarklet_code.strip().startswith('('):
                    bookmarklet_code = f'(async function(){{{bookmarklet_code}}})()'
                
                # Esegui il bookmarklet
                driver.execute_script(bookmarklet_code)
                print("✅ Bookmarklet eseguito")
                
                return True
            except Exception as e:
                print(f"❌ Errore esecuzione bookmarklet: {e}")
                return False
        
        def wait_for_scraping_complete(driver, max_wait=1200):
            """Attendi completamento scraping (overlay con 'finito')"""
            print(f"⏰ Attendo completamento scraping (max {max_wait//60} minuti)...")
            
            start_time = time.time()
            
            while time.time() - start_time < max_wait:
                try:
                    # Cerca overlay di stato
                    overlay_text = driver.execute_script("""
                        const overlay = document.getElementById('imm-scr-status');
                        return overlay ? overlay.textContent : null;
                    """)
                    
                    if overlay_text:
                        print(f"   Status: {overlay_text}")
                        
                        if 'finito' in overlay_text.lower():
                            print("✅ Scraping completato!")
                            return True
                    
                    time.sleep(5)
                    
                except Exception as e:
                    print(f"⚠️  Errore controllo status: {e}")
                    time.sleep(5)
            
            print("⚠️  Timeout - recupero dati parziali")
            return False
        
        def extract_data_from_localstorage(driver):
            """Estrai dati dal localStorage"""
            print("📥 Estrazione dati da localStorage...")
            
            try:
                data = driver.execute_script("""
                    const key = 'immobiliare_scrape_data_v3';
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : null;
                """)
                
                if data and len(data) > 0:
                    print(f"✅ Estratti {len(data)} immobili da localStorage")
                    return data
                else:
                    print("⚠️  Nessun dato in localStorage")
                    return None
                    
            except Exception as e:
                print(f"❌ Errore estrazione localStorage: {e}")
                return None
        
        def save_results(data, driver):
            """Salva risultati in file"""
            print("💾 Salvataggio risultati...")
            
            output_dir = Path('./scraped_data')
            output_dir.mkdir(exist_ok=True)
            
            timestamp = time.strftime('%Y-%m-%dT%H-%M-%S')
            
            # Salva JSON dati
            if data:
                json_file = output_dir / f'immobiliare_{timestamp}.json'
                with open(json_file, 'w', encoding='utf-8') as f:
                    json.dump(data, f, indent=2, ensure_ascii=False)
                print(f"✅ Dati salvati: {json_file}")
                
                # Salva anche latest
                latest_file = output_dir / 'immobiliare_latest.json'
                with open(latest_file, 'w', encoding='utf-8') as f:
                    json.dump(data, f, indent=2, ensure_ascii=False)
                
                # Summary
                with_price = sum(1 for item in data if item.get('price'))
                with_surface = sum(1 for item in data if item.get('surface'))
                with_photo = sum(1 for item in data if item.get('photo'))
                
                summary = {
                    'timestamp': time.strftime('%Y-%m-%d %H:%M:%S'),
                    'totalItems': len(data),
                    'stats': {
                        'withPrice': with_price,
                        'withSurface': with_surface,
                        'withPhoto': with_photo
                    },
                    'method': 'selenium_chrome_real',
                    'success': True
                }
                
                summary_file = output_dir / f'summary_{timestamp}.json'
                with open(summary_file, 'w') as f:
                    json.dump(summary, f, indent=2)
                
                latest_summary = output_dir / 'summary_latest.json'
                with open(latest_summary, 'w') as f:
                    json.dump(summary, f, indent=2)
            
            # Screenshot
            try:
                screenshot_file = output_dir / f'screenshot_{timestamp}.png'
                driver.save_screenshot(str(screenshot_file))
                print(f"📸 Screenshot salvato: {screenshot_file}")
            except Exception as e:
                print(f"⚠️  Screenshot fallito: {e}")
            
            return True
        
        def main():
            print("=" * 60)
            print("IMMOBILIARE.IT SCRAPER - Chrome Reale")
            print("=" * 60)
            
            # Leggi configurazione
            target_url = read_config()
            bookmarklet_code = read_bookmarklet()
            
            print(f"🎯 Target URL: {target_url}")
            print(f"📄 Bookmarklet: {len(bookmarklet_code)} caratteri")
            
            driver = None
            
            try:
                # Setup Chrome
                print("\n🚀 Avvio Chrome...")
                driver = setup_chrome_driver()
                print("✅ Chrome avviato")
                
                # Naviga al sito
                print(f"\n🌐 Navigazione a: {target_url}")
                driver.get(target_url)
                
                # Attendi caricamento
                wait_for_page_load(driver)
                print(f"✅ Pagina caricata: {driver.title}")
                
                # Comportamento umano
                simulate_human_behavior(driver)
                
                # Cookie banner
                handle_cookie_banner(driver)
                
                # Esegui bookmarklet
                if not execute_bookmarklet(driver, bookmarklet_code):
                    raise Exception("Bookmarklet execution failed")
                
                # Attendi completamento
                completed = wait_for_scraping_complete(driver, max_wait=1200)
                
                # Estrai dati
                scraped_data = extract_data_from_localstorage(driver)
                
                if not scraped_data or len(scraped_data) == 0:
                    # Screenshot per debug
                    driver.save_screenshot('error_screenshot.png')
                    raise Exception("Nessun dato estratto")
                
                # Salva risultati
                save_results(scraped_data, driver)
                
                print(f"\n✅ SCRAPING COMPLETATO: {len(scraped_data)} immobili")
                return True
                
            except Exception as e:
                print(f"\n❌ ERRORE: {e}")
                
                if driver:
                    try:
                        driver.save_screenshot('error_screenshot.png')
                        print("📸 Screenshot di errore salvato")
                    except:
                        pass
                
                return False
                
            finally:
                if driver:
                    print("\n🔚 Chiusura Chrome...")
                    driver.quit()
        
        if __name__ == '__main__':
            try:
                success = main()
                exit(0 if success else 1)
            except Exception as e:
                print(f"\n💥 ERRORE CRITICO: {e}")
                import traceback
                traceback.print_exc()
                exit(1)
        PYSCRIPT
        
        echo "✅ Script Python creato"
    
    - name: Setup Xvfb for headless display
      run: |
        sudo apt-get install -y xvfb
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        sleep 3
        echo "✅ Display virtuale avviato"
    
    - name: Run Chrome scraping
      timeout-minutes: 25
      run: |
        echo "🎬 Avvio scraping con Chrome reale..."
        xvfb-run --auto-servernum python3 chrome_scraper.py
        
        echo ""
        echo "📂 Contenuto scraped_data/:"
        ls -la scraped_data/ 2>/dev/null || echo "Directory vuota o non esistente"
    
    - name: Create summary report
      if: always()
      run: |
        echo "📊 CREAZIONE REPORT"
        echo "=================="
        
        if [ -f "scraped_data/summary_latest.json" ]; then
          echo "✅ Summary trovato:"
          cat scraped_data/summary_latest.json
        else
          echo "⚠️  Nessun summary trovato"
        fi
        
        if [ -f "scraped_data/immobiliare_latest.json" ]; then
          ITEMS=$(jq 'length' scraped_data/immobiliare_latest.json)
          echo "✅ Dati trovati: ${ITEMS} immobili"
        else
          echo "⚠️  Nessun dato trovato"
        fi
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: immobiliare-data-${{ github.run_number }}
        path: |
          scraped_data/
          error_screenshot.png
        retention-days: 90
    
    - name: Commit and push results
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add scraped_data/*.json 2>/dev/null || true
        git commit -m "🏠 Update $(date +'%Y-%m-%d %H:%M')" || true
        git push || true